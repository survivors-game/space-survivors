name: Calidad del proyecto

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sincronizar archivo de dependencias
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sincronizar package-lock"
            git push origin HEAD:main
          fi

      - name: Instalar dependencias de forma reproducible
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Revisar código
        run: npm run lint

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Compilar aplicación
        run: npm run build
